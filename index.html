<!DOCTYPE html>
<html lang="zh-TW" class="dark">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>物料戰情室 v21.0 - 工程物料庫存管理系統</title>
    <link rel="icon" type="image/png"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📦%3C/text%3E%3C/svg%3E">

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Tippy.js Tooltips -->
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/animations/shift-away.css">

    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>

    <!-- GSAP Animation Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <!-- Hammer.js Touch Gestures -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>

    <!-- Day.js -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/zh-tw.js"></script>

    <!-- Fuse.js -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 100: '#1a1a1a', 200: '#151515', 300: '#101010', 400: '#0a0a0a', 500: '#000000' }
                    }
                }
            }
        }
    </script>

    <style>
        /* ===== Design Tokens ===== */
        :root {
            --bg-base: #09090b;
            --bg-card: #111113;
            --bg-elevated: #18181b;
            --bg-hover: #1f1f23;
            --border: #27272a;
            --border-subtle: #1e1e21;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --text-faint: #52525b;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --accent-muted: rgba(139, 92, 246, 0.15);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --cyan: #06b6d4;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
        }

        /* ===== 1. Reset & Base ===== */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }

        body {
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        /* ===== 2. Scrollbar ===== */
        ::-webkit-scrollbar {
            width: 4px;
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ===== 3. Skeleton Loading ===== */
        .skeleton {
            background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-elevated) 50%, var(--bg-card) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-md);
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        /* ===== 4. Cards & Surfaces ===== */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            transition: border-color 0.2s;
        }

        .card:hover {
            border-color: var(--border);
        }

        .card-elevated {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
        }

        /* ===== 5. Buttons ===== */
        .btn-interactive {
            transition: all 0.15s ease;
            cursor: pointer;
            min-width: 44px;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-elevated);
            color: var(--text-primary);
            font-weight: 500;
        }

        .btn-interactive:hover {
            background: var(--bg-hover);
        }

        .btn-interactive:active {
            transform: scale(0.97);
        }

        /* ===== 6. Category Chips ===== */
        .cat-chip {
            transition: all 0.15s ease;
            white-space: nowrap;
            border-radius: 9999px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
        }

        .cat-chip.active {
            background: var(--text-primary) !important;
            color: var(--bg-base) !important;
            border-color: var(--text-primary) !important;
            font-weight: 600;
        }

        .cat-chip:hover:not(.active) {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .cat-chip .chip-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            font-size: 10px;
            font-weight: 700;
            padding: 0 4px;
            background: rgba(255, 255, 255, 0.1);
            margin-left: 4px;
        }

        .cat-chip.active .chip-count {
            background: rgba(0, 0, 0, 0.15);
        }

        /* ===== 7. Navigation ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            transition: all 0.15s ease;
            cursor: pointer;
            color: var(--text-faint);
            position: relative;
        }

        .nav-item.active {
            color: var(--text-primary);
        }

        .nav-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 20px;
            height: 2px;
            background: var(--accent);
            border-radius: 999px;
            transition: transform 0.2s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .nav-item.active::after {
            transform: translateX(-50%) scaleX(1);
        }

        /* ===== 8. Bottom Sheet ===== */
        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-elevated);
            border-top-left-radius: var(--radius-xl);
            border-top-right-radius: var(--radius-xl);
            border-top: 1px solid var(--border);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
            z-index: 200;
            max-height: 85vh;
            padding-bottom: calc(env(safe-area-inset-bottom) + 20px);
        }

        .bottom-sheet.open {
            transform: translateY(0);
        }

        .bottom-sheet-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 199;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .bottom-sheet-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet-handle {
            width: 36px;
            height: 4px;
            background: var(--text-faint);
            border-radius: 999px;
            margin: 10px auto;
        }

        .bottom-sheet.dragging {
            transition: none !important;
        }

        /* ===== 9. Pages & Transitions ===== */
        .page {
            display: none;
            animation: pageIn 0.25s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes pageIn {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 10. Status Colors ===== */
        .status-ok {
            color: var(--success);
        }

        .status-low {
            color: var(--warning);
        }

        .status-out {
            color: var(--danger);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .status-dot.ok {
            background: var(--success);
        }

        .status-dot.low {
            background: var(--warning);
        }

        .status-dot.out {
            background: var(--danger);
        }

        .low-stock-alert {
            border-color: var(--warning) !important;
        }

        .out-of-stock {
            border-color: var(--danger) !important;
            background: rgba(239, 68, 68, 0.04) !important;
        }

        /* ===== 11. Dashboard Visuals ===== */
        .donut-chart {
            position: relative;
        }

        .donut-chart svg {
            transform: rotate(-90deg);
        }

        .donut-center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .health-segment {
            height: 8px;
            transition: width 0.8s cubic-bezier(0.32, 0.72, 0, 1);
        }

        /* ===== 12. Quick Action Cards (Minimal) ===== */
        .quick-action-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 16px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .quick-action-card:hover {
            border-color: var(--border);
            background: var(--bg-elevated);
        }

        .quick-action-card:active {
            transform: scale(0.97);
        }

        /* ===== 13. Text Remove & AI ===== */
        .text-remove-area {
            width: 100%;
            min-height: 150px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px;
            color: var(--text-primary);
            font-size: 15px;
            resize: vertical;
            font-family: inherit;
        }

        .text-remove-area:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--accent-muted);
        }

        /* ===== 14. Batch Items ===== */
        .batch-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            font-size: 14px;
        }

        .batch-item.success {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
        }

        .batch-item.warning {
            background: rgba(245, 158, 11, 0.1);
            color: #fbbf24;
        }

        .batch-item.error {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
        }

        /* ===== 15. Loading Spinner ===== */
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== 16. Transfer UI ===== */
        .transfer-input-number {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 16px;
            font-family: inherit;
        }

        .transfer-input-number:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--accent-muted);
        }

        .transfer-quick-btn {
            padding: 14px 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .transfer-quick-btn:hover {
            background: var(--accent-muted);
            border-color: var(--accent);
        }

        .transfer-action-btn {
            flex: 1;
            padding: 16px;
            border-radius: var(--radius-lg);
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }

        .transfer-action-btn.confirm {
            background: var(--accent);
            color: #fff;
        }

        .transfer-action-btn.confirm:hover {
            background: var(--accent-hover);
        }

        .transfer-action-btn.cancel {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        /* ===== 17. Operator ===== */
        .operator-btn {
            transition: all 0.2s ease;
        }

        .operator-btn:hover {
            transform: translateY(-1px);
        }

        /* ===== 18. Misc ===== */
        .big-number {
            font-variant-numeric: tabular-nums;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .number-update {
            animation: numberPop 0.35s ease;
        }

        @keyframes numberPop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }

            100% {
                transform: scale(1);
            }
        }

        .site-item {
            transition: all 0.2s ease;
        }

        .site-item:hover {
            background: var(--bg-hover) !important;
        }

        .category-bar-item {
            transition: width 0.8s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .health-segment {
            height: 8px;
            transition: width 0.8s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .number-update {
            animation: numPulse 0.4s ease;
        }

        @keyframes numPulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
                color: var(--accent);
            }

            100% {
                transform: scale(1);
            }
        }

        .search-result-count {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.7rem;
            color: var(--accent);
            font-weight: 700;
            pointer-events: none;
        }

        .shortage-cat-chip {
            transition: all 0.15s;
            cursor: pointer;
        }

        .shortage-cat-chip.active {
            background: var(--text-primary) !important;
            color: var(--bg-base) !important;
            font-weight: 700;
        }

        /* ===== 19. Sort/Filter Controls ===== */
        .filter-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 9999px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .filter-pill.active {
            background: var(--accent-muted);
            color: var(--accent);
            border-color: var(--accent);
        }

        .filter-pill:hover:not(.active) {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        /* ===== 20. Mobile Touch ===== */
        @media (hover: none) and (pointer: coarse) {

            .btn-interactive,
            .cat-chip,
            .nav-item,
            .quick-action-card,
            .transfer-quick-btn,
            .filter-pill {
                -webkit-user-select: none;
                user-select: none;
            }

            .btn-interactive:active,
            .quick-action-card:active {
                transform: scale(0.95);
                transition: transform 0.1s ease;
            }

            .nav-item:active {
                transform: scale(0.9);
            }
        }

        .long-press-selected {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
    </style>
</head>

<body>
    <!-- Toast 容器 -->
    <div id="toastBox"
        class="fixed bottom-24 left-1/2 -translate-x-1/2 z-[9999] flex flex-col gap-2 w-[90%] max-w-[400px] pointer-events-none">
    </div>

    <!-- Bottom Sheet Overlay -->
    <div id="bottomSheetOverlay" class="bottom-sheet-overlay" onclick="closeAllSheets()"></div>

    <!-- 主容器 -->
    <div class="relative min-h-screen pb-24">
        <!-- Header -->
        <header id="header" class="sticky top-0 z-40"
            style="background:rgba(9,9,11,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border-subtle);">
            <div class="px-5 py-3">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <h1 class="text-lg font-extrabold text-white tracking-tight">物料戰情室</h1>
                        <span
                            class="text-[10px] px-2 py-0.5 rounded-md bg-zinc-800 text-zinc-500 font-semibold border border-zinc-700/50">v22.0</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span id="headerOperator"
                            class="text-[11px] text-zinc-500 font-medium cursor-pointer hover:text-zinc-300 transition-colors"
                            onclick="switchPage('settings')">黃俊瑋</span>
                        <div id="statusBadge"
                            class="text-[10px] px-2.5 py-1 rounded-full bg-zinc-900 text-zinc-500 border border-zinc-800 font-medium">
                            連線中...</div>
                    </div>
                </div>
                <div class="flex gap-4 mt-2.5">
                    <div class="flex items-center gap-1.5"><span
                            class="text-[10px] text-zinc-600 font-medium">品項</span><span id="headerTotalItems"
                            class="text-sm font-bold text-zinc-300">-</span></div>
                    <div class="flex items-center gap-1.5"><span
                            class="text-[10px] text-zinc-600 font-medium">F22</span><span id="headerSiteItems"
                            class="text-sm font-bold text-cyan-400">-</span></div>
                    <div class="flex items-center gap-1.5"><span class="status-dot low"></span><span
                            class="text-[10px] text-zinc-600 font-medium">低庫存</span><span id="headerLowStock"
                            class="text-sm font-bold text-amber-400">-</span></div>
                </div>
            </div>
        </header>

        <!-- Dashboard 頁面 -->
        <div id="page-dashboard" class="page active">
            <div class="px-5 py-4 space-y-3">
                <!-- 快速操作 -->
                <div class="grid grid-cols-2 gap-2.5">
                    <div class="quick-action-card" onclick="openTextRemove()">
                        <div class="flex items-center gap-2.5 mb-2">
                            <div class="w-8 h-8 rounded-lg flex items-center justify-center"
                                style="background:var(--accent-muted);"><span class="text-base">🤖</span></div>
                            <p class="text-sm font-bold text-white">AI 移出</p>
                        </div>
                        <p class="text-[11px] text-zinc-500">模糊輸入 · 智能匹配</p>
                    </div>
                    <div class="quick-action-card" onclick="copyPurchaseList()">
                        <div class="flex items-center gap-2.5 mb-2">
                            <div class="w-8 h-8 rounded-lg flex items-center justify-center"
                                style="background:rgba(6,182,212,0.12);"><span class="text-base">📋</span></div>
                            <p class="text-sm font-bold text-white">採購清單</p>
                        </div>
                        <p class="text-[11px] text-zinc-500">一鍵複製缺料清單</p>
                    </div>
                </div>

                <!-- 庫存健康度 -->
                <div class="card p-4">
                    <div class="flex items-center justify-between mb-3">
                        <p class="text-xs font-semibold text-zinc-400">庫存健康度</p>
                        <div class="flex items-center gap-3 text-[10px] text-zinc-500">
                            <span class="flex items-center gap-1"><span class="status-dot ok"></span> 充足</span>
                            <span class="flex items-center gap-1"><span class="status-dot low"></span> 偏低</span>
                            <span class="flex items-center gap-1"><span class="status-dot out"></span> 缺貨</span>
                        </div>
                    </div>
                    <div class="flex rounded-full overflow-hidden bg-zinc-800/50" id="healthBar">
                        <div class="health-segment" id="healthOk" style="width:0;background:var(--success);"></div>
                        <div class="health-segment" id="healthLow" style="width:0;background:var(--warning);"></div>
                        <div class="health-segment" id="healthOut" style="width:0;background:var(--danger);"></div>
                    </div>
                    <div class="flex justify-between mt-2 text-[10px] text-zinc-500">
                        <span id="healthOkLabel">-</span>
                        <span id="healthLowLabel">-</span>
                        <span id="healthOutLabel">-</span>
                    </div>
                </div>

                <!-- 分類甜甜圈 + 缺料中心 -->
                <div class="grid grid-cols-5 gap-2.5">
                    <div class="col-span-2 card p-3">
                        <p class="text-[10px] font-semibold text-zinc-500 mb-2 text-center">分類佔比</p>
                        <div class="donut-chart flex items-center justify-center" style="width:100%;aspect-ratio:1;">
                            <svg id="donutSvg" viewBox="0 0 120 120" width="100%" height="100%"></svg>
                            <div class="donut-center">
                                <span id="donutTotal" class="text-lg font-extrabold text-white">-</span>
                                <span class="text-[9px] text-zinc-500">品項</span>

    <script>
            (function () {
                'use strict';

                // ===== 1. 設定與常量 =====
                var API_URL = (window.APP_CONFIG && window.APP_CONFIG.apiUrl) || 'https://script.google.com/macros/s/AKfycbzOQx4W3SmewfhKSl2jSnQI4f29WzoNSqOLwnofb7T7vY06DzyEeUx6l2YSUieAOf-y-g/exec';
                var TIMEOUT = (window.APP_CONFIG && Number(window.APP_CONFIG.timeout)) || 20000;
                var DEBOUNCE_DELAY = 600;
                var OPERATOR_STORAGE_KEY = 'officeInventory.currentOperator';

                // ===== 2. 應用狀態 =====
                var state = {
                    stock: [],
                    filtered: [],
                    category: 'all',
                    searchText: '',
                    currentPage: 'dashboard',
                    currentItem: null,
                    isLoading: false,
                    currentOperator: '黃俊瑋',
                    selectedItems: [],
                    textRemoveResults: [],
                    transferItemId: null
                };

                var OPERATORS = ['黃俊瑋', '戴庭宇', '徐伊恩'];
                var fuseInstance = null;

                // ===== 3. 工具函數 =====
                function $(id) { return document.getElementById(id); }
                function safeNum(v, d) { var n = Number(v); return isNaN(n) ? (d || 0) : n; }
                function safeStr(v, d) { return (v == null || v === '') ? (d || '') : String(v); }
                function formatNumber(num) { return num % 1 === 0 ? num : num.toFixed(1); }
                function roundQty(num) { return Math.round(safeNum(num) * 1000) / 1000; }
                function escapeHtml(str) {
                    var div = document.createElement('div');
                    div.textContent = str;
                    return div.innerHTML;
                }
                function escapeJsString(str) {
                    return safeStr(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r?\n/g, ' ');
                }
                function csvEscape(value) {
                    var text = safeStr(value);
                    if (/[",\n]/.test(text)) return '"' + text.replace(/"/g, '""') + '"';
                    return text;
                }
                function debounce(func, delay) {
                    var timeoutId;
                    return function () {
                        var context = this, args = arguments;
                        clearTimeout(timeoutId);
                        timeoutId = setTimeout(function () { func.apply(context, args); }, delay);
                    };
                }
                function loadOperatorPreference() {
                    try {
                        var saved = window.localStorage.getItem(OPERATOR_STORAGE_KEY);
                        if (saved && OPERATORS.indexOf(saved) >= 0) state.currentOperator = saved;
                    } catch (err) { }
                }
                function saveOperatorPreference(op) {
                    try {
                        window.localStorage.setItem(OPERATOR_STORAGE_KEY, op);
                    } catch (err) { }
                }
                function fetchWithTimeout(url, options) {
                    options = options || {};
                    if (typeof AbortController === 'undefined') return fetch(url, options);
                    var controller = new AbortController();
                    var timerId = setTimeout(function () { controller.abort(); }, TIMEOUT);
                    var nextOptions = Object.assign({}, options, { signal: controller.signal });
                    return fetch(url, nextOptions)
                        .then(function (res) {
                            clearTimeout(timerId);
                            return res;
                        })
                        .catch(function (err) {
                            clearTimeout(timerId);
                            if (err && err.name === 'AbortError') throw new Error('連線逾時，請稍後再試');
                            throw err;
                        });
                }
                function parseApiResponse(text) {
                    if (text.indexOf('<!DOCTYPE') >= 0) throw new Error('收到 HTML 非 JSON');
                    try {
                        return JSON.parse(text);
                    } catch (err) {
                        throw new Error('API 回傳格式錯誤');
                    }
                }
                function refreshInventoryViews() {
                    applyFilters();
                    updateDashboard();
                }
                function refreshCurrentItemSheet(id) {
                    var bottomSheet = $('bottomSheet');
                    if (!bottomSheet || !bottomSheet.classList.contains('open') || !state.currentItem) return;
                    if (id && String(state.currentItem.id) !== String(id)) return;
                    openBottomSheet(state.currentItem.id);
                }

                // ===== 4. 分類引擎 =====
                var categoryConfig = {
                    wire: { keywords: ['電線', '電纜', 'cable', 'wire', 'XIPE', 'CSA', '細纜', '細芯', '控制電纜', 'PVC電線', '導線', '線材'], icon: '🔌', label: '電線', color: '#8b5cf6' },
                    terminal: { keywords: ['端子', 'terminal', '絕緣套管'], icon: '🔗', label: '端子', color: '#06b6d4' },
                    consumable: { keywords: ['扎線帶', '紮線帶', '束線帶', '膠帶', '膠布', '絕緣膠帶', '電火布', '耗材', 'tape', '標籤', '標示', '貼紙', '止洩帶', '奇異筆', '紅筆', '筆'], icon: '📦', label: '耗材', color: '#ec4899' },
                    hardware: { keywords: ['耐龍合接頭', '耐龍盒接頭', '盒接頭', '合接頭', '防水盒接頭', '防水接頭', '牙圈'], icon: '🔧', label: '五金', color: '#6366f1' },
                    hose: { keywords: ['軟管'], icon: '〰️', label: '軟管', color: '#f59e0b' }
                };

                function getCategory(item) {
                    var s = (safeStr(item.name) + safeStr(item.spec)).toLowerCase();
                    for (var cat in categoryConfig) {
                        for (var i = 0; i < categoryConfig[cat].keywords.length; i++) {
                            if (s.indexOf(categoryConfig[cat].keywords[i]) >= 0) return cat;
                        }
                    }
                    return 'hardware';
                }

                function getCategoryIcon(cat) {
                    return (categoryConfig[cat] || categoryConfig.hardware).icon;
                }

                // ===== 5. Toast 通知 =====
                function toast(msg, type) {
                    type = type || 'info';
                    var icons = { success: 'success', error: 'error', info: 'info', warning: 'warning' };
                    Swal.fire({
                        toast: true, position: 'top', icon: icons[type] || 'info', title: msg,
                        showConfirmButton: false, timer: 3000, timerProgressBar: true
                    });
                }

                // ===== 6. API 通訊層 =====
                function loadData() {
                    if (state.isLoading) return;
                    state.isLoading = true;
                    $('loadingState').classList.remove('hidden');
                    $('errorState').classList.add('hidden');
                    $('statusBadge').textContent = '連線中...';

                    fetchWithTimeout(API_URL + '?t=' + Date.now(), { cache: 'no-cache' })
                        .then(function (res) { return res.text(); })
                        .then(function (text) {
                            var data = parseApiResponse(text);
                            if (data.status === 'error') throw new Error(data.msg);
                            if (!data.stock || !Array.isArray(data.stock)) throw new Error('資料格式錯誤');

                            state.stock = data.stock.map(function (it, i) {
                                return {
                                    id: safeStr(it.id, 'i' + i),
                                    name: safeStr(it.name, '未命名'),
                                    spec: safeStr(it.spec, '-'),
                                    unit: safeStr(it.unit, '個'),
                                    warehouseQty: safeNum(it.warehouseQty),
                                    siteQty: safeNum(it.siteQty),
                                    safeQty: safeNum(it.safeQty, 1)
                                };
                            });

                            applyFilters();
                            updateDashboard();
                            $('loadingState').classList.add('hidden');
                            $('statusBadge').textContent = '線上';
                            $('statusBadge').className = 'text-xs px-4 py-2 rounded-full bg-green-900/20 text-green-400 border border-green-700/30';
                            toast('已載入 ' + state.stock.length + ' 筆資料', 'success');
                            state.isLoading = false;
                        })
                        .catch(function (err) {
                            state.isLoading = false;
                            $('loadingState').classList.add('hidden');
                            $('errorState').classList.remove('hidden');
                            $('errorMsg').textContent = err.message;
                            $('statusBadge').textContent = '連線失敗';
                            $('statusBadge').className = 'text-xs px-4 py-2 rounded-full bg-red-900/20 text-red-400 border border-red-700/30';
                        });
                }

                function postAPI(action, params) {
                    return fetchWithTimeout(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(Object.assign({ action: action }, params))
                    })
                        .then(function (res) {
                            return res.text().then(function (text) {
                                var data = parseApiResponse(text);
                                if (!res.ok) throw new Error(data.msg || ('HTTP ' + res.status));
                                return data;
                            });
                        })
                        .then(function (data) {
                            if (data.status === 'error') throw new Error(data.msg);
                            return data;
                        });
                }

                // ===== 7. 頁面路由 =====
                function switchPage(page) {
                    if (state.currentPage === page) return;
                    var oldPage = $('page-' + state.currentPage);
                    state.currentPage = page;
                    document.querySelectorAll('.nav-item').forEach(function (item) { item.classList.remove('active'); });
                    var activeNav = document.querySelector('[data-page="' + page + '"]');
                    if (activeNav) {
                        activeNav.classList.add('active');
                        // GSAP spring bounce on nav icon
                        if (typeof gsap !== 'undefined') {
                            var icon = activeNav.querySelector('span:first-child');
                            if (icon) gsap.fromTo(icon, { scale: 0.7 }, { scale: 1, duration: 0.4, ease: 'elastic.out(1, 0.4)' });
                        }
                    }
                    $('header').style.display = (page === 'dashboard') ? 'block' : 'none';
                    if (page === 'settings') renderOperatorSelector();
                    closeAllSheets();
                    // GSAP page transition
                    if (typeof gsap !== 'undefined' && oldPage) {
                        gsap.to(oldPage, {
                            opacity: 0, y: 10, duration: 0.15, onComplete: function () {
                                document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('active'); });
                                var newPage = $('page-' + page);
                                newPage.classList.add('active');
                                gsap.fromTo(newPage, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out' });
                            }
                        });
                    } else {
                        document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('active'); });
                        $('page-' + page).classList.add('active');
                    }
                    // Haptic feedback
                    if (navigator.vibrate) navigator.vibrate(10);
                }

                function closeAllSheets() {
                    document.querySelectorAll('.bottom-sheet').forEach(function (sheet) {
                        sheet.classList.remove('open');
                        sheet.setAttribute('aria-hidden', 'true');
                    });
                    $('bottomSheetOverlay').classList.remove('open');
                    document.body.style.overflow = '';
                }

                // ===== 8. Dashboard 模組 =====
                function updateDashboard() {
                    $('settingsItemCount').textContent = state.stock.length;
                    animateNumber($('headerTotalItems'), state.stock.length);

                    var lowCount = 0, outCount = 0, okCount = 0, siteCount = 0;
                    var categoryCounts = {}, categoryItemCounts = {}, totalQty = 0;
                    for (var cat in categoryConfig) { categoryCounts[cat] = 0; categoryItemCounts[cat] = 0; }

                    for (var i = 0; i < state.stock.length; i++) {
                        var item = state.stock[i];
                        var total = item.warehouseQty + item.siteQty;
                        if (total <= 0) outCount++;
                        else if (total < item.safeQty) lowCount++;
                        else okCount++;
                        if (item.siteQty > 0) siteCount++;
                        var c = getCategory(item);
                        categoryCounts[c] += total;
                        categoryItemCounts[c]++;
                        totalQty += total;
                    }

                    animateNumber($('headerLowStock'), lowCount);
                    animateNumber($('headerSiteItems'), siteCount);

                    // ===== Health Bar =====
                    var total_items = state.stock.length || 1;
                    $('healthOk').style.width = (okCount / total_items * 100) + '%';
                    $('healthLow').style.width = (lowCount / total_items * 100) + '%';
                    $('healthOut').style.width = (outCount / total_items * 100) + '%';
                    $('healthOkLabel').textContent = '充足 ' + okCount;
                    $('healthLowLabel').textContent = '偏低 ' + lowCount;
                    $('healthOutLabel').textContent = '缺貨 ' + outCount;

                    // ===== Donut Chart =====
                    renderDonutChart(categoryItemCounts, state.stock.length);

                    // ===== Category Bar =====
                    if (totalQty === 0) totalQty = 1;
                    var barHtml = '', legendHtml = '';
                    for (var cat in categoryCounts) {
                        if (categoryCounts[cat] > 0) {
                            var pct = (categoryCounts[cat] / totalQty * 100).toFixed(1);
                            var cfg = categoryConfig[cat];
                            barHtml += '<div class="category-bar-item cursor-pointer" style="width:' + pct + '%;background:' + cfg.color + '"></div>';
                            legendHtml += '<span class="flex items-center gap-1"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:' + cfg.color + '"></span>' + cfg.label + ' ' + pct + '%</span>';
                        }
                    }
                    $('categoryBar').innerHTML = barHtml;
                    $('categoryLegend').innerHTML = legendHtml;

                    updateShortageCenter();
                    renderSiteItems();
                }

                function animateNumber(el, target) {
                    if (!el) return;
                    var current = parseInt(el.textContent) || 0;
                    if (current === target) return;
                    el.textContent = target;
                    el.classList.add('number-update');
                    setTimeout(function () { el.classList.remove('number-update'); }, 400);
                }

                function renderDonutChart(counts, total) {
                    var svg = $('donutSvg');
                    if (!svg) return;
                    $('donutTotal').textContent = total;
                    var cx = 60, cy = 60, r = 42, circumference = 2 * Math.PI * r;
                    var offset = 0;
                    var paths = '';
                    var legendHtml = '';
                    for (var cat in counts) {
                        if (counts[cat] <= 0) continue;
                        var pct = counts[cat] / (total || 1);
                        var dash = pct * circumference;
                        var cfg = categoryConfig[cat];
                        paths += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + cfg.color + '" stroke-width="14" stroke-dasharray="' + dash + ' ' + (circumference - dash) + '" stroke-dashoffset="-' + offset + '" style="transition:stroke-dasharray 0.8s,stroke-dashoffset 0.8s;"/>';
                        offset += dash;
                        legendHtml += '<div class="flex items-center gap-1.5 text-[9px]"><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:' + cfg.color + '"></span><span class="text-zinc-500">' + cfg.label + '</span><span class="text-zinc-400 font-bold">' + counts[cat] + '</span></div>';
                    }
                    if (total === 0) paths = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="#27272a" stroke-width="14"/>';
                    svg.innerHTML = paths;
                    $('donutLegend').innerHTML = legendHtml;
                }

                // ===== 9. 缺料中心模組 =====
                var shortageFilter = { urgency: null, category: null };

                function classifyShortages() {
                    var classified = { critical: [], severe: [], low: [] };
                    for (var i = 0; i < state.stock.length; i++) {
                        var item = state.stock[i];
                        var total = item.warehouseQty + item.siteQty;
                        var safe = item.safeQty;
                        if (total >= safe) continue;
                        var data = { item: item, total: total, safe: safe, shortage: safe - total, category: getCategory(item) };
                        if (total === 0) { data.urgencyLevel = 'critical'; classified.critical.push(data); }
                        else if (total / safe < 0.5) { data.urgencyLevel = 'severe'; classified.severe.push(data); }
                        else { data.urgencyLevel = 'low'; classified.low.push(data); }
                    }
                    return classified;
                }

                function updateShortageCenter() {
                    var classified = classifyShortages();
                    $('criticalCount').textContent = classified.critical.length;
                    $('severeCount').textContent = classified.severe.length;
                    $('lowCount').textContent = classified.low.length;

                    var allShortages = classified.critical.concat(classified.severe, classified.low);
                    var filtered = allShortages.filter(function (d) {
                        if (shortageFilter.urgency && d.urgencyLevel !== shortageFilter.urgency) return false;
                        if (shortageFilter.category && d.category !== shortageFilter.category) return false;
                        return true;
                    });

                    if (allShortages.length === 0) {
                        $('shortageList').classList.add('hidden');
                        $('allStockOk').classList.remove('hidden');
                        return;
                    }
                    $('shortageList').classList.remove('hidden');
                    $('allStockOk').classList.add('hidden');

                    var html = '';
                    var groups = [
                        { level: 'critical', label: '🔴 緊急', color: 'red', items: [] },
                        { level: 'severe', label: '🟠 嚴重', color: 'orange', items: [] },
                        { level: 'low', label: '🟡 低庫存', color: 'yellow', items: [] }
                    ];
                    filtered.forEach(function (d) {
                        groups.forEach(function (g) { if (g.level === d.urgencyLevel) g.items.push(d); });
                    });

                    groups.forEach(function (g) {
                        if (g.items.length === 0) return;
                        html += '<div class="mb-4"><p class="text-xs font-bold text-' + g.color + '-400 mb-2">' + g.label + ' (' + g.items.length + ')</p>';
                        g.items.forEach(function (data) {
                            var item = data.item;
                            html += '<div class="flex items-center justify-between p-3 rounded-xl bg-' + g.color + '-900/20 border border-' + g.color + '-500/30 mb-2 cursor-pointer" onclick="openBottomSheet(\'' + escapeJsString(item.id) + '\')">' +
                                '<div><p class="text-white font-bold">' + escapeHtml(item.spec) + '</p><p class="text-xs text-gray-400">' + escapeHtml(item.name) + '</p></div>' +
                                '<div class="text-right"><p class="text-' + g.color + '-400 font-bold">缺 ' + Math.ceil(data.shortage) + '</p><p class="text-xs text-gray-500">' + data.total + '/' + data.safe + '</p></div>' +
                                '</div>';
                        });
                        html += '</div>';
                    });
                    $('shortageList').innerHTML = html;
                }

                function filterShortageByUrgency(urgency) {
                    shortageFilter.urgency = (shortageFilter.urgency === urgency) ? null : urgency;
                    updateShortageCenter();
                }

                function filterShortageByCategory(category) {
                    shortageFilter.category = (category === 'all') ? null : category;
                    document.querySelectorAll('.shortage-cat-chip').forEach(function (chip) {
                        var isActive = (category === 'all' && chip.textContent === '全部') || chip.getAttribute('onclick').indexOf("'" + category + "'") >= 0;
                        chip.className = isActive ? 'shortage-cat-chip active px-4 py-2 rounded-full text-sm font-bold bg-white text-black' : 'shortage-cat-chip px-4 py-2 rounded-full text-sm bg-white/5 text-gray-300';
                    });
                    updateShortageCenter();
                }

                function copyPurchaseList() {
                    var lowItems = state.stock.filter(function (item) {
                        return (item.warehouseQty + item.siteQty) < item.safeQty;
                    });
                    if (lowItems.length === 0) { toast('沒有需要補貨的物料！', 'info'); return; }
                    var text = '📋 採購清單\n═══════════════════\n';
                    lowItems.forEach(function (item, i) {
                        var shortage = Math.ceil(item.safeQty - item.warehouseQty - item.siteQty);
                        text += (i + 1) + '. ' + item.name + ' (' + item.spec + ') - 缺 ' + shortage + ' ' + item.unit + '\n';
                    });
                    navigator.clipboard.writeText(text).then(function () { toast('✅ 已複製採購清單', 'success'); });
                }

                // ===== F22 物料列表 =====
                function renderSiteItems() {
                    var siteItems = state.stock.filter(function (item) { return item.siteQty > 0; });
                    siteItems.sort(function (a, b) { return b.siteQty - a.siteQty; });
                    $('siteItemCount').textContent = siteItems.length;

                    if (siteItems.length === 0) {
                        $('siteItemsList').classList.add('hidden');
                        $('siteItemsEmpty').classList.remove('hidden');
                        return;
                    }
                    $('siteItemsEmpty').classList.add('hidden');
                    $('siteItemsList').classList.remove('hidden');

                    $('siteItemsList').innerHTML = siteItems.map(function (item) {
                        var itemId = escapeJsString(item.id);
                        return '<div class="site-item flex items-center justify-between p-4 rounded-xl bg-white/5 border border-white/5 cursor-pointer" onclick="openBottomSheet(\'' + itemId + '\')">' +
                            '<div class="flex items-center gap-3"><span class="text-2xl">' + getCategoryIcon(getCategory(item)) + '</span>' +
                            '<div><p class="font-bold text-white">' + escapeHtml(item.name) + '</p><p class="text-sm text-gray-400">' + escapeHtml(item.spec) + '</p></div></div>' +
                            '<div class="text-right"><p class="text-3xl font-bold text-cyan-400">' + item.siteQty + '</p><p class="text-xs text-gray-400">件</p></div>' +
                            '</div>';
                    }).join('');
                }

                // ===== 10. 列表與搜尋模組 =====
                var statusFilter = 'all';
                var sortMode = null;

                function getItemStatus(item) {
                    var total = item.warehouseQty + item.siteQty;
                    if (total <= 0) return 'out';
                    if (total < item.safeQty) return 'low';
                    return 'ok';
                }

                function filterByStatus(s) {
                    statusFilter = s;
                    document.querySelectorAll('.filter-pill[data-status]').forEach(function (btn) {
                        btn.classList.toggle('active', btn.getAttribute('data-status') === s);
                    });
                    applyFilters();
                }

                function toggleSort(field) {
                    if (field === 'name') sortMode = sortMode === 'name-asc' ? 'name-desc' : 'name-asc';
                    else if (field === 'qty') sortMode = sortMode === 'qty-asc' ? 'qty-desc' : 'qty-asc';
                    applyFilters();
                }

                function applyFilters() {
                    var filtered = state.category === 'all' ? state.stock.slice() : state.stock.filter(function (item) { return getCategory(item) === state.category; });
                    if (statusFilter !== 'all') filtered = filtered.filter(function (item) { return getItemStatus(item) === statusFilter; });
                    if (state.searchText.trim()) {
                        if (typeof Fuse !== 'undefined') {
                            fuseInstance = new Fuse(filtered, { keys: ['name', 'spec'], threshold: 0.3 });
                            filtered = fuseInstance.search(state.searchText).map(function (r) { return r.item; });
                        } else {
                            filtered = filtered.filter(function (item) {
                                return (item.name + ' ' + item.spec).toLowerCase().indexOf(state.searchText.toLowerCase()) >= 0;
                            });
                        }
                    }
                    if (sortMode) {
                        filtered.sort(function (a, b) {
                            if (sortMode === 'name-asc') return (a.name || '').localeCompare(b.name || '');
                            if (sortMode === 'name-desc') return (b.name || '').localeCompare(a.name || '');
                            var aq = a.warehouseQty + a.siteQty, bq = b.warehouseQty + b.siteQty;
                            return sortMode === 'qty-asc' ? aq - bq : bq - aq;
                        });
                    }
                    state.filtered = filtered;
                    renderList();
                }

                var applyFiltersDebounced = debounce(applyFilters, DEBOUNCE_DELAY);

                function renderList() {
                    if (state.filtered.length === 0) {
                        $('inventoryList').innerHTML = '';
                        $('emptyState').classList.remove('hidden');
                        var countEl = $('searchResultCount');
                        if (countEl) countEl.textContent = '';
                        return;
                    }
                    $('emptyState').classList.add('hidden');
                    $('inventoryList').innerHTML = state.filtered.map(function (item) {
                        var total = item.warehouseQty + item.siteQty;
                        var alertClass = total === 0 ? 'out-of-stock' : (total < item.safeQty ? 'low-stock-alert' : '');
                        var itemId = escapeJsString(item.id);
                        var isSelected = state.selectedItems.indexOf(item.id) >= 0;
                        var selectedClass = isSelected ? 'ring-2 ring-cyan-400/70 border-cyan-400/40' : '';
                        return '<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 cursor-pointer ' + alertClass + ' ' + selectedClass + '" onclick="handleItemClick(event, \'' + itemId + '\')">' +
                            '<div class="flex items-center gap-4">' +
                            '<div class="w-10 h-10 rounded-lg bg-zinc-800 flex items-center justify-center text-xl">' + getCategoryIcon(getCategory(item)) + '</div>' +
                            '<div class="flex-1"><p class="text-lg font-bold text-white">' + escapeHtml(item.spec) + '</p><p class="text-sm text-gray-500">' + escapeHtml(item.name) + '</p></div>' +
                            '<div class="flex gap-4 text-right"><div><p class="text-xl font-bold text-purple-400">' + item.warehouseQty + '</p><p class="text-xs text-purple-400/70">公司</p></div>' +
                            '<div><p class="text-xl font-bold text-cyan-400">' + item.siteQty + '</p><p class="text-xs text-cyan-400/70">F22</p></div></div>' +
                            '</div></div>';
                    }).join('');
                    var countEl = $('searchResultCount');
                    if (countEl && state.searchText.trim()) countEl.textContent = state.filtered.length + ' 項';
                    else if (countEl) countEl.textContent = '';
                }

                function handleItemClick(e, id) {
                    if (e.ctrlKey || e.metaKey) { toggleItemSelection(id); return; }
                    openBottomSheet(id);
                }

                function toggleItemSelection(id) {
                    var idx = state.selectedItems.indexOf(id);
                    if (idx >= 0) state.selectedItems.splice(idx, 1);
                    else state.selectedItems.push(id);
                    updateBatchActions();
                    renderList();
                }

                function clearSelection() {
                    state.selectedItems = [];
                    updateBatchActions();
                    renderList();
                }

                function updateBatchActions() {
                    var bar = $('batchActions');
                    if (state.selectedItems.length > 0) {
                        bar.classList.remove('hidden');
                        $('selectedCount').textContent = state.selectedItems.length;
                    } else bar.classList.add('hidden');
                }

                function batchAdjust(type, delta) {
                    if (state.selectedItems.length === 0) { toast('請先選擇物料', 'warning'); return; }
                    var tasks = state.selectedItems.map(function (id) {
                        var item = findItemById(id);
                        if (!item) return Promise.reject(new Error('找不到物料 ' + id));
                        var isW = type === 'w';
                        var oldQty = isW ? item.warehouseQty : item.siteQty;
                        var newQty = roundQty(Math.max(0, oldQty + delta));
                        return updateQty(id, type, newQty, oldQty, item);
                    });
                    Promise.allSettled(tasks).then(function (results) {
                        var successCount = results.filter(function (result) { return result.status === 'fulfilled'; }).length;
                        var failedCount = results.length - successCount;
                        clearSelection();
                        if (failedCount === 0) toast('批量調整完成，共 ' + successCount + ' 項', 'success');
                        else if (successCount > 0) toast('批量調整完成 ' + successCount + ' 項，失敗 ' + failedCount + ' 項', 'warning');
                        else toast('批量調整失敗，請稍後再試', 'error');
                    });
                }

                // ===== 11. Bottom Sheet 模組 =====
                function openBottomSheet(id) {

                    state.currentItem = item;

                    }).join('');

                    $('bottomSheetContent').innerHTML =
                        '<div class="mb-6"><h2 class="text-3xl font-bold text-white mb-2">' + escapeHtml(item.name) + '</h2><p class="text-gray-400">' + escapeHtml(item.spec) + ' · ' + escapeHtml(item.unit) + '</p></div>' +
                        '<div class="bg-zinc-900 rounded-2xl p-4 mb-4"><p class="text-sm text-gray-400 mb-3">操作人員</p><div class="flex gap-2 flex-wrap">' + opButtons + '</div></div>' +
                        // 公司倉
