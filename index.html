                        '<p class="text-5xl font-bold text-purple-400 cursor-pointer" style="border-bottom:2px dashed rgba(168,85,247,0.3);padding-bottom:2px;" id="bs-w-' + id + '" onclick="directEditQty(\'w\')" title="點擊直接輸入數量">' + item.warehouseQty + '</p>' +
                        '<button onclick="adjustQty(\'w\', 1)" class="w-14 h-14 rounded-2xl bg-green-600/20 text-green-400 text-2xl font-bold">+</button>' +
                        '</div>' +
                        '<div class="flex gap-2 mt-3 justify-center flex-wrap">' +
                        '<button onclick="adjustQty(\'w\', -10)" class="px-3 py-1.5 rounded-lg bg-red-600/10 text-red-400 text-xs font-bold border border-red-600/20">-10</button>' +
                        '<button onclick="adjustQty(\'w\', -5)" class="px-3 py-1.5 rounded-lg bg-red-600/10 text-red-400 text-xs font-bold border border-red-600/20">-5</button>' +
                        '<button onclick="directEditQty(\'w\')" class="px-3 py-1.5 rounded-lg bg-purple-600/10 text-purple-400 text-xs font-bold border border-purple-600/20">✏️ 直接輸入</button>' +
                        '<button onclick="adjustQty(\'w\', 5)" class="px-3 py-1.5 rounded-lg bg-green-600/10 text-green-400 text-xs font-bold border border-green-600/20">+5</button>' +
                        '<button onclick="adjustQty(\'w\', 10)" class="px-3 py-1.5 rounded-lg bg-green-600/10 text-green-400 text-xs font-bold border border-green-600/20">+10</button>' +
                        '</div></div>' +
                        '<button onclick="transferToSite(\'' + escapedId + '\')" class="w-full py-4 rounded-2xl bg-cyan-600 text-white font-bold mb-4">📦 轉移至 F22</button>' +
                        // F22 廠區
                        '<div class="bg-zinc-900 rounded-2xl p-4"><p class="text-sm text-gray-400 mb-3">F22廠區庫存</p>' +
                        '<div class="flex items-center justify-between gap-3">' +
                        '<button onclick="adjustQty(\'s\', -1)" class="w-14 h-14 rounded-2xl bg-red-600/20 text-red-400 text-2xl font-bold">−</button>' +
                        '<p class="text-5xl font-bold text-cyan-400 cursor-pointer" style="border-bottom:2px dashed rgba(6,182,212,0.3);padding-bottom:2px;" id="bs-s-' + id + '" onclick="directEditQty(\'s\')" title="點擊直接輸入數量">' + item.siteQty + '</p>' +
                        '<button onclick="adjustQty(\'s\', 1)" class="w-14 h-14 rounded-2xl bg-green-600/20 text-green-400 text-2xl font-bold">+</button>' +
                        '</div>' +
                        '<div class="flex gap-2 mt-3 justify-center flex-wrap">' +
                        '<button onclick="adjustQty(\'s\', -10)" class="px-3 py-1.5 rounded-lg bg-red-600/10 text-red-400 text-xs font-bold border border-red-600/20">-10</button>' +
                        '<button onclick="adjustQty(\'s\', -5)" class="px-3 py-1.5 rounded-lg bg-red-600/10 text-red-400 text-xs font-bold border border-red-600/20">-5</button>' +
                        '<button onclick="directEditQty(\'s\')" class="px-3 py-1.5 rounded-lg bg-cyan-600/10 text-cyan-400 text-xs font-bold border border-cyan-600/20">✏️ 直接輸入</button>' +
                        '<button onclick="adjustQty(\'s\', 5)" class="px-3 py-1.5 rounded-lg bg-green-600/10 text-green-400 text-xs font-bold border border-green-600/20">+5</button>' +
                        '<button onclick="adjustQty(\'s\', 10)" class="px-3 py-1.5 rounded-lg bg-green-600/10 text-green-400 text-xs font-bold border border-green-600/20">+10</button>' +
                        '</div></div>';

                    $('bottomSheet').classList.add('open');
                    $('bottomSheet').setAttribute('aria-hidden', 'false');
                    $('bottomSheetOverlay').classList.add('open');
                    document.body.style.overflow = 'hidden';
                }

                function directEditQty(type) {
                    if (!state.currentItem) return;
                    var item = state.currentItem;
                    var isW = type === 'w';
                    var oldQty = isW ? item.warehouseQty : item.siteQty;
                    var label = isW ? '公司倉庫存' : 'F22廠區庫存';

                    Swal.fire({
                        title: label,
                        text: item.name + ' (' + item.spec + ')',
                        input: 'number',
                        inputValue: oldQty,
                        inputAttributes: { min: 0, step: 0.1, style: 'font-size:28px;text-align:center;font-weight:bold;' },
                        showCancelButton: true,
                        confirmButtonText: '確認修改',
                        cancelButtonText: '取消',
                        confirmButtonColor: '#8b5cf6',
                        inputValidator: function (value) {
                            if (value === '' || value === null) return '請輸入數量';
                            if (Number(value) < 0) return '數量不能為負數';
                        }
                    }).then(function (result) {
                        if (result.isConfirmed) {
                            var newQty = roundQty(parseFloat(result.value));
                            updateQty(item.id, type, newQty, oldQty, item);
                        }
                    });
                }

                function setCurrentOperator(op) {
                    state.currentOperator = op;
                    saveOperatorPreference(op);
                    if ($('headerOperator')) $('headerOperator').textContent = op;
                }

                function setOperator(op) {
                    setCurrentOperator(op);
                    renderOperatorSelector();
                    if (state.currentItem) openBottomSheet(state.currentItem.id);
                    toast('已切換：' + op, 'info');
                }

                function findItemById(id) {
                    for (var i = 0; i < state.stock.length; i++) {
                        if (state.stock[i].id == id) return state.stock[i];
                    }
                    return null;
                }

                function updateQty(id, type, newQty, oldQty, item) {
                    if (!item) item = findItemById(id);
                    if (!item) return Promise.reject(new Error('找不到該物料'));
                    newQty = roundQty(newQty);
                    if (!isFinite(newQty) || newQty < 0) {
                        var quantityError = new Error('數量格式錯誤');
                        toast(quantityError.message, 'error');
                        return Promise.reject(quantityError);
                    }
                    if (newQty === oldQty) return Promise.resolve();

                    var previousWarehouseQty = item.warehouseQty;
                    var previousSiteQty = item.siteQty;
                    if (type === 'w') item.warehouseQty = newQty;
                    else item.siteQty = newQty;
                    if (navigator.vibrate) navigator.vibrate(15);
                    refreshInventoryViews();
                    refreshCurrentItemSheet(id);

                    return postAPI(type === 'w' ? 'warehouse_audit' : 'audit', { id: id, qty: newQty, person: state.currentOperator })
                        .then(function () {
                            toast('已同步', 'success');
                            refreshInventoryViews();
                            refreshCurrentItemSheet(id);
                        })
                        .catch(function (e) {
                            item.warehouseQty = previousWarehouseQty;
                            item.siteQty = previousSiteQty;
                            refreshInventoryViews();
                            refreshCurrentItemSheet(id);
                            toast('同步失敗：' + e.message, 'error');
                            throw e;
                        });
                }

                function adjustQty(type, delta) {
                    if (!state.currentItem) return;
                    var id = state.currentItem.id;
                    var isW = type === 'w';
                    var oldQty = isW ? state.currentItem.warehouseQty : state.currentItem.siteQty;
                    var newQty = roundQty(Math.max(0, oldQty + delta));
                    updateQty(id, type, newQty, oldQty, state.currentItem);
                }

                // ===== 12. 轉移操作模組 =====
                function transferToSite(id) {
                    var item = findItemById(id);
                    if (!item || item.warehouseQty <= 0) { toast('公司倉庫存不足', 'warning'); return; }

                    state.transferItemId = id;
                    var quickBtns = [0.5, 1, 2, 5, 10].filter(function (v) { return v <= item.warehouseQty; })
                        .map(function (v) { return '<button onclick="setTransferQty(' + v + ')" class="transfer-quick-btn">' + (v % 1 === 0 ? v : v.toFixed(1)) + '</button>'; }).join('');

                    $('transferInputContent').innerHTML =
                        '<h2 class="text-2xl font-bold text-white mb-4 text-center">' + escapeHtml(item.name) + '</h2>' +
                        '<div class="bg-cyan-900/20 rounded-xl p-4 mb-4 text-center"><p class="text-sm text-cyan-400">公司倉庫存</p><p class="text-3xl font-bold text-white">' + item.warehouseQty + '</p></div>' +
                        '<p class="text-sm text-gray-400 mb-2">輸入轉移數量</p>' +
                        '<input type="number" id="transferQtyInput" class="transfer-input-number" min="0.1" max="' + item.warehouseQty + '" step="0.1" placeholder="0">' +
                        '<div class="grid grid-cols-4 gap-2 mb-4">' + quickBtns + '</div>' +
                        '<div class="flex gap-3"><button onclick="closeTransferInput()" class="transfer-action-btn cancel">取消</button><button onclick="confirmTransfer()" class="transfer-action-btn confirm">確認轉移</button></div>';

                    $('transferInputSheet').classList.add('open');
                }

                function setTransferQty(qty) {
                    var input = $('transferQtyInput');
                    if (input) input.value = qty % 1 === 0 ? qty : qty.toFixed(1);
                }

                function closeTransferInput() {
                    $('transferInputSheet').classList.remove('open');
                }

                function confirmTransfer() {
                    var id = state.transferItemId;
                    var item = findItemById(id);
                    if (!item) { closeTransferInput(); return; }
                    var qty = roundQty(parseFloat($('transferQtyInput').value));
                    if (isNaN(qty) || qty <= 0 || qty > item.warehouseQty) { toast('請輸入有效數量', 'error'); return; }

                    postAPI('move_to_site', { id: id, qty: qty, person: state.currentOperator })
                        .then(function () {
                            item.warehouseQty = roundQty(item.warehouseQty - qty);
                            item.siteQty = roundQty(item.siteQty + qty);
                            refreshInventoryViews();
                            closeTransferInput();
                            closeAllSheets();
                            toast('✅ 已轉移 ' + qty + ' 件', 'success');
                        })
                        .catch(function (e) { toast('轉移失敗：' + e.message, 'error'); });
                }

                // ===== 13. 設定模組 =====
                function renderOperatorSelector() {
                    $('operatorSelector').innerHTML = OPERATORS.map(function (op) {
                        var isActive = op === state.currentOperator;
                        return '<button onclick="setOperatorGlobal(\'' + escapeJsString(op) + '\')" class="h-14 flex items-center justify-between px-4 rounded-xl border-2 ' + (isActive ? 'bg-purple-600 border-purple-400 text-white' : 'bg-zinc-800 border-zinc-700 text-gray-300') + '">' +
                            '<span class="font-bold">' + escapeHtml(op) + '</span>' + (isActive ? '<span>✓</span>' : '') + '</button>';
                    }).join('');
                }

                function setOperatorGlobal(op) {
                    setCurrentOperator(op);
                    renderOperatorSelector();
                    toast('已切換：' + op, 'success');
                }

                function exportCSV() {
                    if (state.filtered.length === 0) { toast('沒有資料可匯出', 'warning'); return; }
                    var csv = 'ID,品名,規格,單位,公司倉,F22廠區,安全存量\n';
                    state.filtered.forEach(function (item) {
                        csv += [item.id, item.name, item.spec, item.unit, item.warehouseQty, item.siteQty, item.safeQty].map(csvEscape).join(',') + '\n';
                    });
                    var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv' });
                    var link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = '庫存_' + new Date().toISOString().slice(0, 10) + '.csv';
                    link.click();
                    toast('已匯出 CSV', 'success');
                }

                // ===== 語音搜尋 =====
                function startVoiceSearch() {
                    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if (!SR) { toast('瀏覽器不支援語音', 'warning'); return; }
                    var rec = new SR();
                    rec.lang = 'zh-TW';
                    rec.onresult = function (e) {
                        $('searchInput').value = e.results[0][0].transcript;
                        state.searchText = e.results[0][0].transcript;
                        applyFiltersDebounced();
                    };
                    rec.start();
                    toast('🎤 請說話...', 'info');
                }

                // ===== 14. AI 智能移出模組 =====
                function openTextRemove() {
                    $('quickActionContent').innerHTML =
                        '<h2 class="text-2xl font-bold text-white mb-4">📝 文字移出</h2>' +
                        '<p class="text-sm text-gray-400 mb-2">輸入物料和數量（每行一項）</p>' +
                        '<textarea id="textRemoveInput" class="text-remove-area mb-4" placeholder="5.5端子*1\n5.5（黃線）*2\n軟管*1"></textarea>' +
                        '<button onclick="parseTextRemove()" class="w-full py-3 rounded-xl bg-purple-600 text-white font-bold mb-4">解析清單</button>' +
                        '<div id="textRemovePreview" class="hidden"><h3 class="font-bold mb-2">預覽</h3><div id="textRemoveList" class="space-y-2"></div></div>' +
                        '<div id="textRemoveActions" class="hidden flex gap-2 mt-4"><button onclick="closeAllSheets()" class="flex-1 py-3 rounded-xl bg-zinc-700">取消</button><button onclick="confirmTextRemove()" class="flex-1 py-3 rounded-xl bg-red-600 text-white font-bold">確認移出</button></div>';
                    $('quickActionSheet').classList.add('open');
                    $('bottomSheetOverlay').classList.add('open');
                    document.body.style.overflow = 'hidden';
                    state.textRemoveResults = [];
                }

                function parseTextRemove() {
                    var input = $('textRemoveInput').value;
                    if (!input.trim()) { toast('請輸入清單', 'warning'); return; }

                    // 顯示載入狀態
                    $('textRemovePreview').classList.remove('hidden');
                    $('textRemoveList').innerHTML = '<div class="flex items-center gap-2 py-4 justify-center"><div class="loading-spinner"></div><span class="text-gray-400">AI 智能解析中...</span></div>';

                    // 傳送簡化的庫存清單給 AI
                    var stockListSimple = state.stock.map(function (item) {
                        return { id: item.id, name: item.name, spec: item.spec };
                    });

                    postAPI('gemini_parse_text', { text: input, stockList: stockListSimple })
                        .then(function (res) {
                            if (res.status === 'success' && res.items) {
                                // 將 AI 結果匹配回實際庫存物件
                                var parsed = [];
                                res.items.forEach(function (ai) {
                                    var qty = roundQty(Math.max(0, safeNum(ai.qty, 1)));
                                    var matchedItem = ai.matchedId ? findItemById(ai.matchedId) : null;
                                    if (!matchedItem && ai.matchedName) {
                                        matchedItem = state.stock.find(function (item) {
                                            return item.name === ai.matchedName && item.spec === ai.matchedSpec;
                                        });
                                    }
                                    parsed.push({
                                        rawName: ai.originalInput || ai.matchedName || ai.name || '',
                                        qty: qty || 1,
                                        matchedItem: matchedItem || null,
                                        matchedName: ai.matchedName || '',
                                        matchedSpec: ai.matchedSpec || '',
                                        canRemove: !!(matchedItem && matchedItem.siteQty >= (qty || 1))
                                    });
                                });
                                state.textRemoveResults = parsed;
                                renderTextRemovePreview();
                            } else {
                                throw new Error(res.msg || '解析失敗');
                            }
                        })
                        .catch(function (err) {
                            toast('AI 解析失敗: ' + err.message, 'error');
                            $('textRemoveList').innerHTML = '<p class="text-red-400 text-center py-4">解析失敗，請重試</p>';
                        });
                }

                function renderTextRemovePreview() {
                    $('textRemovePreview').classList.remove('hidden');
                    $('textRemoveActions').classList.remove('hidden');
                    if (state.textRemoveResults.length === 0) {
                        $('textRemoveList').innerHTML = '<p class="text-gray-400 text-center py-4">未能匹配任何品項</p>';
                        return;
                    }
                    $('textRemoveList').innerHTML = state.textRemoveResults.map(function (r) {
                        var status = r.canRemove ? 'success' : (r.matchedItem ? 'warning' : 'error');
                        var statusText = r.canRemove ? '✅ 可移出' : (r.matchedItem ? '⚠️ 庫存不足 (現有 ' + r.matchedItem.siteQty + ')' : '❌ 未找到');
                        var matchedName = r.matchedItem ? r.matchedItem.name : (r.matchedName || '未找到對應品項');
                        var matchedSpec = r.matchedItem ? r.matchedItem.spec : (r.matchedSpec || '請調整文字後再試');
                        return '<div class="batch-item ' + status + ' p-3 rounded-xl bg-white/5 border border-white/10 mb-2">' +
                            '<div class="flex justify-between items-center">' +
                            '<div><p class="font-bold text-white">' + escapeHtml(matchedName) + '</p>' +
                            '<p class="text-xs text-cyan-400">' + escapeHtml(matchedSpec) + '</p>' +
                            '<p class="text-xs text-gray-500">輸入: ' + escapeHtml(r.rawName) + '</p></div>' +
                            '<div class="text-right"><p class="text-2xl font-bold text-green-400">' + r.qty + '</p>' +
                            '<p class="text-xs ' + (r.canRemove ? 'text-green-400' : 'text-orange-400') + '">' + statusText + '</p></div>' +
                            '</div></div>';
                    }).join('');
                }

                function confirmTextRemove() {
                    var toRemove = state.textRemoveResults.filter(function (r) { return r.canRemove; });
                    if (toRemove.length === 0) { toast('沒有可移出的物料', 'warning'); return; }
                    var grouped = {};
                    toRemove.forEach(function (r) {
                        var key = String(r.matchedItem.id);
                        if (!grouped[key]) grouped[key] = { item: r.matchedItem, qty: 0 };
                        grouped[key].qty = roundQty(grouped[key].qty + r.qty);
                    });
                    var tasks = Object.keys(grouped).map(function (key) {
                        var entry = grouped[key];
                        var item = entry.item;
                        var newQty = roundQty(item.siteQty - entry.qty);
                        return postAPI('audit', { id: item.id, qty: newQty, person: state.currentOperator })
                            .then(function () {
                                item.siteQty = newQty;
                                return entry;
                            });
                    });
                    Promise.allSettled(tasks).then(function (results) {
                        var successCount = results.filter(function (result) { return result.status === 'fulfilled'; }).length;
                        var failedCount = results.length - successCount;
                        refreshInventoryViews();
                        if (failedCount === 0) {
                            closeAllSheets();
                            toast('✅ 移出 ' + successCount + ' 項', 'success');
                        } else if (successCount > 0) {
                            toast('部分移出成功 ' + successCount + ' 項，失敗 ' + failedCount + ' 項', 'warning');
                        } else {
                            toast('移出失敗，請稍後重試', 'error');
                        }
                    });
                }

                // ===== 15. 手勢與觸控模組 =====
                function initGestures() {
                    // Bottom Sheet swipe-to-close
                    if (typeof Hammer !== 'undefined') {
                        document.querySelectorAll('.bottom-sheet').forEach(function (sheet) {
                            var mc = new Hammer(sheet, { recognizers: [[Hammer.Pan, { direction: Hammer.DIRECTION_VERTICAL }]] });
                            var startY = 0;
                            mc.on('panstart', function () {
                                sheet.classList.add('dragging');
                                startY = 0;
                            });
                            mc.on('panmove', function (e) {
                                if (e.deltaY > 0) {
                                    sheet.style.transform = 'translateY(' + e.deltaY + 'px)';
                                }
                            });
                            mc.on('panend', function (e) {
                                sheet.classList.remove('dragging');
                                sheet.style.transform = '';
                                if (e.deltaY > 100 || e.velocityY > 0.5) {
                                    closeAllSheets();
                                } else {
                                    sheet.style.transform = '';
                                }
                            });
                        });
                    }
                }

                // Long-press to select items (mobile-friendly alternative to Ctrl+Click)
                var longPressTimer = null;
                function initLongPress(el, id) {
                    el.addEventListener('touchstart', function (e) {
                        longPressTimer = setTimeout(function () {
                            if (navigator.vibrate) navigator.vibrate(30);
                            toggleItemSelection(id);
                            renderList();
                        }, 500);
                    }, { passive: true });
                    el.addEventListener('touchend', function () { clearTimeout(longPressTimer); });
                    el.addEventListener('touchmove', function () { clearTimeout(longPressTimer); });
                }

                // GSAP dashboard entrance animation
                function animateDashboardEntrance() {
                    if (typeof gsap === 'undefined') return;
                    var cards = document.querySelectorAll('#page-dashboard .quick-action-card, #page-dashboard details, #page-dashboard .bg-zinc-900\\/70');
                    gsap.fromTo(cards, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08, ease: 'power2.out' });
                }

                // ===== 16. 事件綁定與初始化 =====
                function initEvents() {
                    if ($('searchInput')) {
                        $('searchInput').addEventListener('input', function (e) {
                            state.searchText = e.target.value;
                            applyFiltersDebounced();
                        });
                    }
                    if ($('categoryChips')) {
                        $('categoryChips').addEventListener('click', function (e) {
                            var btn = e.target.closest('.cat-chip');
                            if (!btn) return;
                            document.querySelectorAll('.cat-chip').forEach(function (c) { c.classList.remove('active'); });
                            btn.classList.add('active');
                            state.category = btn.getAttribute('data-cat');
                            if (navigator.vibrate) navigator.vibrate(10);
                            applyFiltersDebounced();
                        });
                    }
                    document.addEventListener('keydown', function (e) {
                        if (e.key === 'Escape') closeAllSheets();
                    });
                    // Init gestures after a short delay to ensure DOM is ready
                    setTimeout(initGestures, 300);
                }

                // ===== 初始化 =====
                function init() {
                    loadOperatorPreference();
                    if ($('headerOperator')) $('headerOperator').textContent = state.currentOperator;
                    initEvents();
                    loadData();
                    setTimeout(animateDashboardEntrance, 800);
                }

                // 全域函數
                window.switchPage = switchPage;
                window.closeAllSheets = closeAllSheets;
                window.openBottomSheet = openBottomSheet;
                window.setOperator = setOperator;
                window.setOperatorGlobal = setOperatorGlobal;
                window.adjustQty = adjustQty;
                window.transferToSite = transferToSite;
                window.setTransferQty = setTransferQty;
                window.closeTransferInput = closeTransferInput;
                window.confirmTransfer = confirmTransfer;
                window.handleItemClick = handleItemClick;
                window.toggleItemSelection = toggleItemSelection;
                window.clearSelection = clearSelection;
                window.batchAdjust = batchAdjust;
                window.exportCSV = exportCSV;
                window.loadData = loadData;
                window.startVoiceSearch = startVoiceSearch;
                window.filterShortageByUrgency = filterShortageByUrgency;
                window.filterShortageByCategory = filterShortageByCategory;
                window.copyPurchaseList = copyPurchaseList;
                window.openTextRemove = openTextRemove;
                window.parseTextRemove = parseTextRemove;
                window.confirmTextRemove = confirmTextRemove;
                window.filterByStatus = filterByStatus;
                window.toggleSort = toggleSort;
                window.directEditQty = directEditQty;
                window.updateOCRQty = function () { };
                window.toggleOCR = function () { };

                if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
                else init();
            })();
    </script>
</body>

</html>
